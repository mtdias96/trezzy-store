STAGE: ${self:provider.stage}
REGION: ${self:provider.region}
SERVICE_NAME: ${self:service}
# Sem fallback de propósito: o deploy deve falhar se faltar.
DATABASE_URL: ${env:DATABASE_URL}
# Saem dos recursos em sls/resources/cognito.yml.
COGNITO_POOL_ID: !Ref UserPool
COGNITO_CLIENT_ID: !Ref UserPoolClient
COGNITO_CLIENT_SECRET: !GetAtt UserPoolClient.ClientSecret
# Saem de sls/resources/media.yml.
MEDIA_BUCKET_NAME: !Ref MediaBucket
MEDIA_CDN_DOMAIN_NAME: !GetAtt MediaCDN.DomainName
