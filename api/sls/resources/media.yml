Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: ${param:mediaBucketDeletionPolicy}
    UpdateReplacePolicy: ${param:mediaBucketDeletionPolicy}
    Properties:
      BucketName: !Sub '${self:service}-${sls:stage}-media-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - PUT
            AllowedOrigins:
              - ${param:webOrigin}
            AllowedHeaders:
              - Content-Type
            MaxAge: 3600

  MediaCDNOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: ${self:service}-${sls:stage}-MediaCDNOAC
        Description: OAC for MediaBucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MediaCDN:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        Origins:
          - Id: MediaBucketOrigin
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref MediaCDNOAC
        DefaultCacheBehavior:
          TargetOriginId: MediaBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          # Managed-CachingOptimized.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed-SecurityHeadersPolicy: o nosniff impede o navegador de tratar o arquivo como outra coisa que não imagem.
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowMediaCDNRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${MediaBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${MediaCDN}'

Outputs:
  MediaBucketName:
    Value: !Ref MediaBucket
  MediaCDNDomainName:
    Value: !GetAtt MediaCDN.DomainName
