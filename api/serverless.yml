org: treezy
app: trezzy-api
service: trezzy-api

# Sem isso o CLI se auto-atualiza e o deploy deixa de ser reprodutível.
frameworkVersion: '~4.44.0'

params:
  prod:
    cognitoDeletionProtection: ACTIVE
    mediaBucketDeletionPolicy: Retain
    webOrigin: https://trezzy-store-web.vercel.app
  default:
    # Fora de prod o pool pode ser recriado (ex: atributo custom alterado exige um pool novo).
    cognitoDeletionProtection: INACTIVE
    mediaBucketDeletionPolicy: Delete
    webOrigin: http://localhost:3000

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: sa-east-1
  memorySize: 512
  timeout: 10
  stage: ${opt:stage, 'dev'}
  logRetentionInDays: 30
  logs:
    lambda:
      logFormat: JSON
  environment: ${file(./sls/config/env.yml)}
  httpApi:
    authorizers:
      cognito:
        identitySource: $request.header.Authorization
        issuerUrl: !GetAtt UserPool.ProviderURL
        audience:
          - !Ref UserPoolClient
  iam:
    role:
      statements:
        # Compensação do signup (Saga). SignUp e InitiateAuth são autorizados pelo secret do client.
        - Effect: Allow
          Action:
            - cognito-idp:AdminDeleteUser
          Resource: !GetAtt UserPool.Arn

package:
  individually: true

build:
  esbuild:
    configFile: ./esbuild.config.mjs

functions:
  health:
    handler: src/main/functions/health.handler
    events:
      - httpApi:
          path: /health
          method: get

  auth:
    handler: src/main/functions/auth.handler
    events:
      - httpApi:
          path: /auth/signup
          method: post
      - httpApi:
          path: /auth/signin
          method: post
      - httpApi:
          path: /auth/signout
          method: post

  account:
    handler: src/main/functions/account.handler
    events:
      - httpApi:
          path: /me
          method: get
          authorizer:
            name: cognito
      - httpApi:
          path: /me/permissions
          method: get
          authorizer:
            name: cognito

  dashboard:
    handler: src/main/functions/dashboard.handler
    events:
      # Rota de admin: o API Gateway exige o scope de admin; o adapter ainda confere a permissão.
      - httpApi:
          path: /admin/dashboard
          method: get
          authorizer:
            name: cognito
            scopes:
              - trezzy/admin

  products:
    handler: src/main/functions/products.handler
    events:
      # Rota de admin: o API Gateway exige o scope de admin; o adapter ainda confere a permissão.
      - httpApi:
          path: /admin/products
          method: post
          authorizer:
            name: cognito
            scopes:
              - trezzy/admin

  media:
    handler: src/main/functions/media.handler
    # Role própria: só a mídia assina upload e lê o bucket. Não herda os statements do provider.
    iam:
      role:
        statements:
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
            Resource: !Sub '${MediaBucket.Arn}/uploads/*'
          # Sem ListBucket, a leitura de um objeto que não existe responde 403 em vez de 404.
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !GetAtt MediaBucket.Arn
    events:
      # Rota de admin: o API Gateway exige o scope de admin; o adapter ainda confere a permissão.
      - httpApi:
          path: /admin/media
          method: post
          authorizer:
            name: cognito
            scopes:
              - trezzy/admin
      - httpApi:
          path: /admin/media/{id}/confirm
          method: post
          authorizer:
            name: cognito
            scopes:
              - trezzy/admin

  # Triggers do UserPool, ligados em sls/resources/cognito.yml (LambdaConfig).
  cognitoPreSignUp:
    handler: src/main/functions/cognito/preSignUp.handler

  cognitoPreTokenGeneration:
    handler: src/main/functions/cognito/preTokenGeneration.handler

resources:
  - ${file(./sls/resources/cognito.yml)}
  - ${file(./sls/resources/media.yml)}
