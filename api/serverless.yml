org: treezy
app: trezzy-api
service: trezzy-api

# Sem isso o CLI se auto-atualiza e o deploy deixa de ser reprodutível.
frameworkVersion: '~4.44.0'

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: sa-east-1
  memorySize: 512
  timeout: 10
  stage: ${opt:stage, 'dev'}
  logRetentionInDays: 30
  logs:
    lambda:
      logFormat: JSON
  environment: ${file(./sls/config/env.yml)}

package:
  individually: true

build:
  esbuild:
    configFile: ./esbuild.config.mjs

functions:
  health:
    handler: src/main/functions/health.handler
    events:
      - httpApi:
          path: /health
          method: get
