org: treezy
app: trezzy-api
service: trezzy-api

# Sem isso o CLI se auto-atualiza e o deploy deixa de ser reprodutível.
frameworkVersion: '~4.44.0'

params:
  prod:
    cognitoDeletionProtection: ACTIVE
  default:
    # Fora de prod o pool pode ser recriado (ex: atributo custom alterado exige um pool novo).
    cognitoDeletionProtection: INACTIVE

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: sa-east-1
  memorySize: 512
  timeout: 10
  stage: ${opt:stage, 'dev'}
  logRetentionInDays: 30
  logs:
    lambda:
      logFormat: JSON
  environment: ${file(./sls/config/env.yml)}
  httpApi:
    authorizers:
      cognito:
        identitySource: $request.header.Authorization
        issuerUrl: !GetAtt UserPool.ProviderURL
        audience:
          - !Ref UserPoolClient
  iam:
    role:
      statements:
        # Compensação do signup (Saga). SignUp e InitiateAuth são autorizados pelo secret do client.
        - Effect: Allow
          Action:
            - cognito-idp:AdminDeleteUser
          Resource: !GetAtt UserPool.Arn

package:
  individually: true

build:
  esbuild:
    configFile: ./esbuild.config.mjs

functions:
  health:
    handler: src/main/functions/health.handler
    events:
      - httpApi:
          path: /health
          method: get

  # Triggers do UserPool, ligados em sls/resources/cognito.yml (LambdaConfig).
  cognitoPreSignUp:
    handler: src/main/functions/cognito/preSignUp.handler

  cognitoPreTokenGeneration:
    handler: src/main/functions/cognito/preTokenGeneration.handler

resources:
  - ${file(./sls/resources/cognito.yml)}
